name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The suite pins date behaviour; run it in a US zone and UTC.
        tz: [America/Denver, UTC]
        # Each TZ still runs the WHOLE suite, split across two shards
        # (own runner + own Postgres service each) to halve wall time.
        shard: [1, 2]
    env:
      TZ: ${{ matrix.tz }}
      # Tests are DB-bound (each worker owns a cloned database), so
      # oversubscribing the 4 vCPUs beats the default of cores/2 = 2.
      TEST_MAX_WORKERS: 4
      TEST_DATABASE_URL: postgresql://lawcrm_test:lawcrm_test@localhost:5432/lawcrm_test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lawcrm_test
          POSTGRES_PASSWORD: lawcrm_test
          POSTGRES_DB: lawcrm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lawcrm_test -d lawcrm_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      # Static checks don't depend on TZ or shard: run them once per TZ.
      - if: matrix.shard == 1
        run: npm run typecheck
      - if: matrix.shard == 1
        run: npm run lint
      - if: matrix.shard == 1
        run: npx prettier --check .
      # Migration chain must reproduce schema.prisma exactly (ADR-016);
      # the pre-commit hook only runs this when prisma/ is staged.
      - if: matrix.shard == 1 && matrix.tz == 'UTC'
        run: npm run check:migrations
      # Build catches what typecheck can't (route segment config,
      # server/client boundary, server-only leaks). Pages are dynamic,
      # so the placeholder URL is never connected to.
      - if: matrix.shard == 1 && matrix.tz == 'UTC'
        run: npx next build
        env:
          DATABASE_URL: postgresql://build:build@localhost:5432/build
          AUTH_SECRET: ci-build-only-not-a-secret
      # Vitest globalSetup pushes the schema and clones per-worker
      # databases; no docker CLI or Prisma agent-consent variable needed.
      - run: npm test -- --shard=${{ matrix.shard }}/2
